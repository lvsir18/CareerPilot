name: careerpilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career} -d ${POSTGRES_DB:-careerpilot}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment: &app-env
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://career:career_dev_only@postgres:5432/careerpilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_SECRET: ${SESSION_SECRET:-replace_with_random_secret}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-careerpilot_session}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-7}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-careerpilot_csrf}
      CSRF_HEADER_NAME: ${CSRF_HEADER_NAME:-X-CSRF-Token}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-[]}
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_IP_ATTEMPTS: ${LOGIN_RATE_LIMIT_IP_ATTEMPTS:-20}
      LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS:-300}
      LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS:-300}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      EXTERNAL_AUTH_ALLOWED_PROVIDERS: ${EXTERNAL_AUTH_ALLOWED_PROVIDERS:-[]}
      EXTERNAL_AUTH_ALLOW_BROWSER_SESSION: ${EXTERNAL_AUTH_ALLOW_BROWSER_SESSION:-false}
      FILE_STORAGE_DIR: /app/uploads
      MAX_RESUME_MB: ${MAX_RESUME_MB:-10}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      MAILBOX_SECRET_KEY: ${MAILBOX_SECRET_KEY:-}
      MAILBOX_SYNC_ENABLED: ${MAILBOX_SYNC_ENABLED:-true}
      MAILBOX_SYNC_INTERVAL_MINUTES: ${MAILBOX_SYNC_INTERVAL_MINUTES:-15}
      MAILBOX_SYNC_LOOKBACK_DAYS: ${MAILBOX_SYNC_LOOKBACK_DAYS:-30}
      MAILBOX_SYNC_MAX_MESSAGES: ${MAILBOX_SYNC_MAX_MESSAGES:-200}
      QQ_IMAP_HOST: ${QQ_IMAP_HOST:-imap.qq.com}
      QQ_IMAP_PORT: ${QQ_IMAP_PORT:-993}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-12}
      AGENT_MAX_GRAPH_STEPS: ${AGENT_MAX_GRAPH_STEPS:-30}
      AGENT_MAX_RUNTIME_SECONDS: ${AGENT_MAX_RUNTIME_SECONDS:-90}
      AGENT_MAX_SEARCH_CALLS: ${AGENT_MAX_SEARCH_CALLS:-3}
      ENABLE_PUBLIC_CONNECTORS: ${ENABLE_PUBLIC_CONNECTORS:-false}
      JOB_SYNC_ENABLED: ${JOB_SYNC_ENABLED:-false}
      JOB_SYNC_INTERVAL_MINUTES: ${JOB_SYNC_INTERVAL_MINUTES:-60}
      CONNECTOR_USER_AGENT: ${CONNECTOR_USER_AGENT:-CareerPilotBot/0.1 (+https://careerpilot.local/bot)}
      CONNECTOR_TIMEOUT_SECONDS: ${CONNECTOR_TIMEOUT_SECONDS:-20}
      CONNECTOR_MAX_RETRIES: ${CONNECTOR_MAX_RETRIES:-2}
      CONNECTOR_BACKOFF_SECONDS: ${CONNECTOR_BACKOFF_SECONDS:-1}
      CONNECTOR_MIN_INTERVAL_SECONDS: ${CONNECTOR_MIN_INTERVAL_SECONDS:-1}
      CONNECTOR_MAX_PAGES: ${CONNECTOR_MAX_PAGES:-20}
      CONNECTOR_PAGE_SIZE: ${CONNECTOR_PAGE_SIZE:-50}
      MANUAL_IMPORT_DIR: /app/fixtures/manual
      ALIBABA_APP_KEY: ${ALIBABA_APP_KEY:-}
      ALIBABA_APP_SECRET: ${ALIBABA_APP_SECRET:-}
      ALIBABA_TENANT_ID: ${ALIBABA_TENANT_ID:-}
      ALIBABA_POSITION_URL_TEMPLATE: ${ALIBABA_POSITION_URL_TEMPLATE:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-none}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-basic}
      TAVILY_MAX_RESULTS: ${TAVILY_MAX_RESULTS:-10}
      TAVILY_MAX_QUERIES_PER_REQUEST: ${TAVILY_MAX_QUERIES_PER_REQUEST:-10}
      TAVILY_MAX_QUERY_TERMS: ${TAVILY_MAX_QUERY_TERMS:-3}
      TAVILY_EXTRACT_DEPTH: ${TAVILY_EXTRACT_DEPTH:-basic}
      TAVILY_EXTRACT_TIMEOUT_SECONDS: ${TAVILY_EXTRACT_TIMEOUT_SECONDS:-20}
      TAVILY_EXTRACT_DAILY_BUDGET: ${TAVILY_EXTRACT_DAILY_BUDGET:-30}
      TAVILY_EXTRACT_CACHE_TTL_SECONDS: ${TAVILY_EXTRACT_CACHE_TTL_SECONDS:-3600}
      SEARCH_MAX_QUERIES_PER_REQUEST: ${SEARCH_MAX_QUERIES_PER_REQUEST:-10}
      SEARCH_MAX_CONCURRENT_REQUESTS: ${SEARCH_MAX_CONCURRENT_REQUESTS:-1}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-10}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-10}
      SEARCH_RATE_LIMIT_PER_MINUTE: ${SEARCH_RATE_LIMIT_PER_MINUTE:-30}
      SEARCH_DAILY_BUDGET_PER_PROVIDER: ${SEARCH_DAILY_BUDGET_PER_PROVIDER:-50}
      SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS:-600}
      OFFICIAL_SITE_DISCOVERY_ENABLED: ${OFFICIAL_SITE_DISCOVERY_ENABLED:-true}
      LEAD_VERIFY_RATE_LIMIT_PER_MINUTE: ${LEAD_VERIFY_RATE_LIMIT_PER_MINUTE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment: *app-env
    command:
      ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 25s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment: *app-env
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/dashboard').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
