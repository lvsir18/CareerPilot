[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os
# Intentionally empty: env.py resolves ALEMBIC_DATABASE_URL or app settings so
# Docker (`postgres` host) and local dev (`localhost`) both work unchanged.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
