[project]
name = "careerpilot-api"
version = "0.1.0"
description = "CareerPilot API - job discovery, profile matching and multi-agent workspace"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# B008: FastAPI Depends() in defaults is intentional.
# RUF001-003: the product UI and error copy are Chinese-first.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep Alembic's layout; they are exercised by tests.
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "integration: tests that require a real PostgreSQL instance",
]
